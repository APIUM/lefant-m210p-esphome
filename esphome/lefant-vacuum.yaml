# Lefant M210P. Replaces the Tuya WBR3 with an ESP-12F on the same footprint.
# UART0 (GPIO1/GPIO3) is the serial link to the vacuum's MCU, so the serial
# logger must stay disabled.

substitutions:
  device_name: lefant-vacuum
  friendly_name: Lefant M210P
  # Compiled in, so it cannot be raised at runtime. Override with
  # -s log_level VERBOSE to expose the raw Tuya frame exchange.
  log_level: DEBUG

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp12e
  restore_from_flash: true

logger:
  baud_rate: 0
  level: ${log_level}

api:
  encryption:
    key: !secret lefant_api_key

ota:
  - platform: esphome
    password: !secret lefant_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: lefant-fallback
    password: !secret lefant_ap_password

captive_portal:

uart:
  id: mcu_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  # The MCU runs at 115200, not the 9600 that is typical for Tuya serial links.
  baud_rate: 115200

time:
  - platform: homeassistant
    id: ha_time

tuya:
  id: tuya_mcu
  uart_id: mcu_uart
  time_id: ha_time
  on_datapoint_update:
    - sensor_datapoint: 5
      datapoint_type: enum
      then:
        - text_sensor.template.publish:
            id: activity
            state: !lambda |-
              switch (x) {
                case 0: return std::string("paused");
                case 1: return std::string("smart");
                case 2: return std::string("wall_follow");
                case 3: return std::string("spiral");
                case 4: return std::string("returning");
                case 5: return std::string("charging");
                case 6: return std::string("random");
                case 7: return std::string("standby");
                default: return std::to_string((int) x);
              }

switch:
  - platform: tuya
    name: Power
    switch_datapoint: 1
  # Datapoint 2 is Tuya's power_go, the cleaning switch. Returning to the dock
  # is the chargego option on datapoint 3.
  - platform: tuya
    name: Clean
    switch_datapoint: 2
  - platform: tuya
    name: Locate
    switch_datapoint: 13

select:
  - platform: tuya
    name: Mode
    enum_datapoint: 3
    optimistic: true
    options:
      0: standby
      1: smart
      2: chargego
      3: random
      4: wall_follow
      5: spiral
  - platform: tuya
    name: Direction
    enum_datapoint: 4
    optimistic: true
    options:
      0: backward
      1: turn_left
      2: turn_right
      3: stop
  - platform: tuya
    name: Fan speed
    enum_datapoint: 101
    optimistic: true
    options:
      0: low
      1: medium
      2: high

sensor:
  - platform: tuya
    name: Battery
    sensor_datapoint: 6
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
  - platform: tuya
    name: Clean area
    sensor_datapoint: 16
    unit_of_measurement: m2
    accuracy_decimals: 0
  - platform: tuya
    name: Clean time
    sensor_datapoint: 17
    unit_of_measurement: min
    accuracy_decimals: 0
  - platform: tuya
    name: Fault code
    sensor_datapoint: 18
    accuracy_decimals: 0

text_sensor:
  # The MCU names the reason for each state change here, for example
  # "Switch way:WHEEL SUP0" when it decides the drive wheels are off the floor.
  - platform: tuya
    name: Status message
    sensor_datapoint: 107
    entity_category: diagnostic
  # Datapoint 108 rotates through several readings, for example
  # "BatVol:07747" and "OBS:0008_0012_0003 Cliff:0006_0006_0011 WALL:000_008".
  - platform: tuya
    name: Sensor telemetry
    sensor_datapoint: 108
    entity_category: diagnostic
  - platform: template
    name: Activity
    id: activity
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: MCU link state
    id: mcu_link_state
    entity_category: diagnostic
    update_interval: 15s
    lambda: |-
      switch ((uint8_t) id(tuya_mcu)->get_init_state()) {
        case 0: return std::string("heartbeat");
        case 1: return std::string("product");
        case 2: return std::string("conf");
        case 3: return std::string("wifi");
        case 4: return std::string("datapoint");
        case 5: return std::string("done");
        default: return std::string("unknown");
      }
